name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint:web

      - name: Build web
        run: npm run build:web

  api:
    name: API (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace @sip/api run prisma:generate

      - name: Typecheck api
        run: npm run lint:api

      - name: Build api
        run: npm run build:api

  engine:
    name: Engine (compile + golden tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/engine/requirements.txt

      - name: Install engine dependencies
        run: python -m pip install -r apps/engine/requirements.txt

      - name: Compile check
        run: python -m py_compile apps/engine/src/main.py

      - name: Golden fixture tests
        run: python apps/engine/tests/run_golden.py
